function save(){
localStorage.setItem("mysecret-save",JSON.stringify({
cursors,histories,rumorUnlocked,hatersUnlocked
}));
}
function load(){
try{
const s=JSON.parse(localStorage.getItem("mysecret-save"));
if(s){
cursors=s.cursors||cursors;
histories=s.histories||histories;
rumorUnlocked=!!s.rumorUnlocked;
hatersUnlocked=!!s.hatersUnlocked;
}
}catch(e){}
}
load();

function toast(t){
$("toast").textContent=t;
$("toast").style.display="block";
setTimeout(()=>$("toast").style.display="none",2200);
}
function unlock(){
if($("pin").value==="0103"){
$("lock").style.display="none";
toast("已解锁 · MY SECRET");
}else{
$("unlockMsg").textContent="密码错误，请重试";
$("pin").value="";
}
}
$("pin").addEventListener("keydown",e=>{if(e.key==="Enter")unlock()});
$("pin").addEventListener("input",()=>{if($("pin").value.length===4)unlock()});

function goHome(){
$("app").style.display="none";
$("screen").style.display="block";
currentApp="";
currentChat="";
}
function goBack(){
if(currentChat){
currentChat="";
renderKakao();
}else goHome();
}

$("app").style.display="block";
$("screen").style.display="none";
const titles={kakao:"KakaoTalk",insta:"Instagram",x:"X",phone:"电话",notes:"备忘录",calendar:"日历",settings:"设置",safari:"Safari",music:"音乐"};
$("headerTitle").textContent=titles[name]||name;
if(name==="kakao")renderKakao();
else if(name==="x")renderX();
else if(name==="insta")renderInsta();
else renderSimple(name);
}
function avatar(id){
if(id==="jun")return `<img src="${AVATAR}" alt="金主训头像">`;
return id==="mom"?"👩":"🧑";
}
function renderKakao(){
$("headerTitle").textContent=currentChat?({jun:"金主训",mom:"妈妈",friend:"朋友"}[currentChat]):"KakaoTalk";
if(!currentChat){
$("appBody").innerHTML='<div id="chatList"></div>';
const contacts=[
["jun","金主训","你还没睡？",true],
["mom","妈妈","吃饭了吗？",rumorUnlocked],
["friend","朋友","你看到 X 了吗？",rumorUnlocked]
];
$("chatList").innerHTML=contacts.map(([id,name,last,unlocked])=>`
<div class="contact" style="opacity:${unlocked?1:.38}" onclick="${unlocked?`openChat('${id}')`:`toast('这段剧情还没有解锁')`}">
<div class="avatar">${avatar(id)}</div>
<div class="contactText"><b>${name}</b><small>${unlocked?last:"尚未解锁"}</small></div>
</div>`).join("");
}else renderChat();
}
function openChat(id){
if(id!=="jun"&&!rumorUnlocked){
toast("这段剧情还没有解锁");
return;
}
currentChat=id;
renderKakao();
}
function renderChat(){
const id=currentChat;
const index=cursors[id];
const names={jun:"金主训",mom:"妈妈",friend:"朋友"};
$("appBody").innerHTML=`
<div id="chat">
<div id="chatTop">
<button onclick="currentChat='';renderKakao()">‹ 聊天</button>
<div id="chatName">${names[id]}</div>
</div>
<div id="messages"></div>
<div id="typing"></div>
<div id="choices"></div>
<div id="composer">
<input id="reply" placeholder="输入消息..." autocomplete="off">
<button id="send" onclick="sendMessage()">发送</button>
</div>
</div>`;
const box=$("messages");
histories[id].forEach(m=>addBubble(m.text,m.translation,m.side,false));
if(index<story[id].length){
const step=story[id][index];
if(!histories[id].some(m=>m.key===index)){
step.in.forEach(([ko,zh])=>{
histories[id].push({key:index,text:ko,translation:zh,side:"in"});
addBubble(ko,zh,"in",false);
});
}
$("choices").innerHTML=step.choices.map((c,i)=>`
<button class="choice" onclick="chooseReply(${JSON.stringify(c).replace(/"/g,"&quot;")})">${escapeHTML(c)}</button>
`).join("");
}else{
$("choices").innerHTML='<span style="font-size:12px;color:#888">暂时没有新消息</span>';
}
box.scrollTop=box.scrollHeight;
save();
}
function escapeHTML(s){
return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function addBubble(text,translation,side,scroll=true){
const box=$("messages");
if(!box)return;
const d=document.createElement("div");
d.className="msg "+side;
d.innerHTML=escapeHTML(text)+(translation?`<span class="translation">${escapeHTML(translation)}</span>`:"");
box.appendChild(d);
if(scroll)box.scrollTop=box.scrollHeight;
}
function chooseReply(text){
$("reply").value=text;
$("reply").focus();
}
function sendMessage(){
if(pending)return;
const id=currentChat;
const index=cursors[id];
const input=$("reply");
const text=input.value.trim();
if(!text){toast("先输入一条消息");return;}
if(index>=story[id].length){toast("目前没有新的消息");return;}

histories[id].push({text,translation:"",side:"out"});
addBubble(text,"","out");
input.value="";
$("choices").innerHTML="";
pending=true;
$("typing").textContent="对方正在输入...";
$("send").disabled=true;

setTimeout(()=>{
pending=false;
$("typing").textContent="";
$("send").disabled=false;
cursors[id]++;

if(id==="jun" && cursors.jun>=15 && !rumorUnlocked){
rumorUnlocked=true;
toast("新通知：X 上出现了关于金主训的消息");
}
if(id==="jun" && cursors.jun>=17){
hatersUnlocked=true;
}
save();
renderChat();
},1000);
}
function renderX(){
$("appBody").innerHTML=`
<div id="feed">
<h2>𝕏　为你推荐</h2>
${!rumorUnlocked?`
<div class="post">暂时没有新的热门消息。<br><small>稍后再查看</small></div>
`:`

<div class="post"><b>@daily_issue</b><p>방금 올라온 제보 봤는데 이거 진짜면 좀 심각한 거 아님?</p><p>刚看到刚发的爆料，如果这是真的，事情是不是有点严重？</p></div>

function renderSimple(name){
const pages={
phone:"<h2>最近通话</h2><p>暂无通话记录</p><button onclick=\"toast('暂无通话记录')\">拨号</button>",
notes:"<h2>备忘录</h2><p>暂无备忘录</p>",
calendar:"<h2>11月</h2><p>周日　周一　周二　周三　周四　周五　周六</p><p>1　2　3　4　5　6　7</p>",
settings:"<h2>设置</h2><p>飞行模式　关闭</p><p>Wi-Fi　已连接</p><p>通知　声音与触感</p><p>隐私与安全性</p><button onclick=\"resetGame()\">重置游戏进度</button>",
safari:"<h2>Safari</h2><input placeholder='搜索或输入网站地址' style='width:100%;padding:12px;border:1px solid #ddd;border-radius:12px'>",
music:"<h2>音乐</h2><p>最近播放</p><p>暂无播放记录</p>"
};
$("appBody").innerHTML=`<div class="simple">${pages[name]||"暂无内容"}</div>`;
}
function resetGame(){
if(confirm("确定要清空所有剧情进度并重新开始吗？")){
localStorage.removeItem("mysecret-save");
location.reload();
}
}
